# XcodeGen spec for the benchmark app. Generate the Xcode project with:
#   brew install xcodegen && cd BenchmarkApp && xcodegen generate
name: FluidStreamBenchmark
options:
  bundleIdPrefix: dev.fluidstreamkit
  deploymentTarget:
    iOS: "17.0"
packages:
  # The library under test: a sibling checkout of FluidStreamKit next to FluidStreamBench.
  FluidStreamKit:
    path: ../../FluidStreamKit
  # This repo's benchmark harness.
  FluidStreamBench:
    path: ..
targets:
  BenchmarkApp:
    type: application
    platform: iOS
    sources:
      - Sources
    dependencies:
      - package: FluidStreamKit
        product: FluidStreamCore
      - package: FluidStreamKit
        product: FluidStreamUI
      - package: FluidStreamBench
        product: FluidStreamBenchmarkKit
    info:
      path: Sources/Info.plist
      properties:
        UILaunchScreen: {}
        # Without this key, iPhone caps CADisplayLink at 60 Hz (RFC-001).
        CADisableMinimumFrameDurationOnPhone: true
        # Uses only Apple's built-in encryption (HTTPS), so TestFlight skips the export-compliance question.
        ITSAppUsesNonExemptEncryption: false
        CFBundleDisplayName: FluidStream Bench
        # Read from the build settings below, so bumping CURRENT_PROJECT_VERSION is enough.
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.fluidstreamkit.benchmark
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"             # iPhone only: the benchmark targets 120 Hz iPhones
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_TEAM: 3359JPU45W
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "4"
